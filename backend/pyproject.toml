[project]
name = "pride-vision-platform"
version = "0.1.0"
description = "PRIDE Vision AI — plataforma simplificada de ASPM"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    # O extra `email` (email-validator) não é opcional aqui: `EmailStr` o exige em
    # tempo de importação, e sem ele `schemas/auth.py` levanta ImportError — o que
    # derruba a aplicação inteira, não só a validação de e-mail. Ver AC-ARQ-21.
    "pydantic[email]>=2.7",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "openai>=1.35",
    # SDK unificado do Gemini. O `google-generativeai` saiu de suporte em
    # 30/11/2025 e o protobuf do qual dependia não carrega no Python 3.14.
    "google-genai>=2.0",
    # Driver do Postgres. O padrão continua sendo SQLite (AC-ARQ-05); isto existe
    # porque hospedagem gratuita não tem disco persistente. Ver DEPLOY.md.
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "cryptography>=43.0",
    "prometheus-client>=0.20",
    "python-json-logger>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# A Vercel detectaria `app/main.py` sozinha, mas heurística é o tipo de coisa que
# muda sem aviso. Declarar o entrypoint deixa o deploy independente dela.
[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true

# Bibliotecas sem type stubs publicados
[[tool.mypy.overrides]]
module = ["google.genai.*", "google.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing -q"
# Silencia um aviso do pytest-asyncio, plugin que pode estar instalado no
# ambiente mas que este projeto não usa (não há testes assíncronos).
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]
