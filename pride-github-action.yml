name: PRIDE Vision AI Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default"
          generateJson: true
        continue-on-error: true

      - name: Upload to PRIDE Vision AI
        run: |
          curl -X POST "https://api.pride-vision.com/api/v1/ingestion/semgrep" \
            -H "Authorization: Bearer $\{{ secrets.PRIDE_API_TOKEN }}" \
            -H "X-Tenant-ID: 2" \
            -F "file=@semgrep.json"